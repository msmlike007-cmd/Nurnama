name: nurnama
description: নূরনামা - নামাজের সময়, আজান, কিবলা, কুরআন ও আরও
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  shared_preferences: ^2.2.3
  flutter_compass: ^0.8.0
  http: ^1.2.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B3D2E"
  adaptive_icon_foreground: "assets/icon_fg.png"
