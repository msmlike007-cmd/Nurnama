workflows:
  nurnama-apk:
    name: Nurnama APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Backup source files
        script: |
          mkdir -p /tmp/src
          for f in main core notifications app_state home_page more_pages quran_dua settings_about; do
            if [ -f "lib/$f.dart" ]; then
              cp "lib/$f.dart" "/tmp/src/$f.dart"
            else
              echo "MISSING: lib/$f.dart"
              exit 1
            fi
          done
          ls -la /tmp/src
      - name: Create Android project
        script: flutter create --platforms=android --org com.masum --project-name nurnama .
      - name: Restore source files
        script: |
          cp /tmp/src/*.dart lib/
          ls -la lib
          head -8 lib/main.dart
      - name: Patch Android and make icon
        script: |
          pip3 install pillow || pip3 install --break-system-packages pillow
          python3 setup.py
      - name: Get packages
        script: flutter pub get
      - name: Launcher icons
        script: dart run flutter_launcher_icons
      - name: Build APK
        script: |
          AZAN=false
          if [ -f azan.mp3 ] || [ -f audio/azan.mp3 ]; then AZAN=true; fi
          flutter build apk --release --dart-define=AZAN=$AZAN
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
