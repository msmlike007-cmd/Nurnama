workflows:
  nurnama-apk:
    name: Nurnama APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: flutter create --platforms=android --org com.masum --project-name nurnama .
      - name: Copy app source files
        script: |
          mkdir -p lib
          for f in main core notifications app_state home_page more_pages quran_dua settings_about; do
            if [ -f "$f.dart" ]; then
              cp "$f.dart" "lib/$f.dart"
            elif [ -f "lib_split/$f.dart" ]; then
              cp "lib_split/$f.dart" "lib/$f.dart"
            else
              echo "MISSING: $f.dart"
              exit 1
            fi
          done
          echo "=== lib files ==="
          ls -la lib
      - name: Patch Android and make icon
        script: |
          pip3 install pillow || pip3 install --break-system-packages pillow
          python3 setup.py
      - name: Get packages
        script: flutter pub get
      - name: Launcher icons
        script: dart run flutter_launcher_icons
      - name: Check main.dart
        script: |
          echo "=== main.dart check ==="
          head -25 lib/main.dart
          grep -n "fromSeed" lib/main.dart
      - name: Build APK
        script: |
          AZAN=false
          if [ -f azan.mp3 ] || [ -f audio/azan.mp3 ]; then AZAN=true; fi
          flutter build apk --release --dart-define=AZAN=$AZAN
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
